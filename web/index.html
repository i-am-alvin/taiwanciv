<body>
  <header id="topbar">
    <div class="brand" title="臺灣文明地圖 taiwanciv"><span class="brand-emblem" aria-hidden="true">★</span><span class="brand-text">臺灣</span></div>
    <div id="yields" class="yields" aria-label="全國產出"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="搜尋縣市、鄉鎮市區" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="搜尋縣市與鄉鎮市區（/ 或 Ctrl K）">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="分享目前的畫面" title="分享：複製連結或下載圖片"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="鍵盤與滑鼠操作說明" title="說明（?）"></button>
      <button id="btn-pedia" class="btn" aria-label="開啟資料年鑑" title="每個數字的意義與資料來源"></button>
    </div>
  </header>

  <canvas id="map" role="img" aria-label="臺灣六角格地圖"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="詳細資料"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="選擇濾鏡"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="濾鏡圖例"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="地圖濾鏡">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="地塊上的資源（R）" title="顯示或隱藏地塊上的資源（R）" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="小地圖：點擊即可跳到該處" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="顯示小地圖"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="搜尋結果" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="分享" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="全國報告" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="資料年鑑">
      <button class="close icon-btn" data-close aria-label="關閉資料年鑑">✕</button>
      <nav id="pedia-nav" aria-label="資料年鑑分頁"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">正在勘查地形…</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
